server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Discovery probes under /.well-known/ must 404, not fall through to the SPA.
    # Libreta's /mcp endpoint is unauthenticated; MCP clients (e.g. Claude
    # Desktop's custom connector) probe several well-known paths
    # (oauth-protected-resource, oauth-authorization-server, openid-configuration)
    # to decide whether the server needs OAuth. The SPA catch-all
    # (try_files … /index.html) answered 200 + HTML for all of them, which the
    # client reads as "OAuth required" → dead-end web auth flow. Libreta serves
    # nothing under /.well-known/, so 404 the whole namespace: that tells the
    # client "no auth — connect to /mcp directly."
    location ^~ /.well-known/ { return 404; }

    # Static assets get long cache; index.html is always fetched fresh so a
    # new bundle is picked up immediately after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Forwarded-header handling for the backend proxies below.
    #
    # When an outer reverse proxy (Caddy, in the mkcert/HTTPS overlay) terminates
    # TLS and forwards to this nginx over plain HTTP, nginx's own `$scheme` is
    # `http` and `$host` loses the external `:PORT`. Forwarding those verbatim
    # makes the backend build redirects with the wrong scheme/port — e.g. the
    # FastMCP mount's `/mcp` → `/mcp/` redirect came out as `http://<host>:80/`,
    # which clients can't follow (dead port 80, downgraded scheme). So prefer the
    # values the outer proxy already set, falling back to nginx's own when we ARE
    # the edge (no outer proxy, e.g. the plain-HTTP deployment).
    #   - proto: use Caddy's X-Forwarded-Proto if present, else our $scheme.
    #     (`map` would be cleaner but is only valid in the http{} block; this
    #     file is included as a server{} block, so use a set/if in server scope.)
    #   - host:  use the incoming Host (Caddy preserves `<host>:8091`), which
    #            already carries the external port; do NOT rewrite it to $host.
    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $fwd_proto $http_x_forwarded_proto;
    }

    # Proxy API + assets to the backend service (alias `api` in the prod
    # compose stack). Adjust if you front Libreta with a separate reverse
    # proxy (Caddy, Traefik) — in that case this block can be removed.
    #
    # The `^~` modifier makes nginx pick this prefix over any regex location.
    # Without it, the static-asset block below (which matches *.svg, *.png,
    # etc.) wins for asset URLs like /api/v1/sources/<id>/assets/foo.svg and
    # the request never reaches the backend.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # The FastMCP transport is mounted at /mcp with an internal path of "/", so a
    # request to bare `/mcp` (no slash) triggers a Starlette mount redirect to
    # `/mcp/`. That redirect is built from the backend's own scheme/host/port and
    # comes out wrong behind the proxy (and uvicorn's ProxyHeadersMiddleware
    # can't reconstruct the non-standard port — it hardcodes port 0 and ignores
    # X-Forwarded-Port). Normalize the slash HERE, at the edge, using the real
    # external scheme+host, so the backend never emits that redirect. Clients may
    # register either `/mcp` or `/mcp/` and both work.
    location = /mcp {
        return 308 $fwd_proto://$http_host/mcp/;
    }

    # MCP streamable-HTTP endpoint (Claude Desktop etc.). The transport keeps a
    # long-lived response open to stream server->client messages, so disable
    # response buffering and the read timeout, and force HTTP/1.1. Same `^~`
    # reasoning as /api/ above.
    location ^~ /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
